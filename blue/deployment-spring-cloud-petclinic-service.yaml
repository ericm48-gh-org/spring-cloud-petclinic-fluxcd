---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-cloud-petclinic-service-deployment-blue
  labels:
    app: spring-cloud-petclinic-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: spring-cloud-petclinic-service
      version: blue
  template:
    metadata:
      labels:
        app: spring-cloud-petclinic-service
        version: blue
    spec:
      containers:
        - name: spring-cloud-petclinic-service
          image: ghcr.io/ericm48-gh-org/spring-cloud-petclinic-service:3.0.6-RELEASE
          ports:
            - containerPort: 8080